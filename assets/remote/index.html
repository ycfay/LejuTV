<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>乐聚频道管理</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
    <header>
        <div>
            <p class="eyebrow">TV Auto</p>
            <h2>频道管理</h2>
        </div>
    </header>

    <section class="card">
        <div class="list-header">
            <h2>频道列表</h2>
            <div class="list-actions">
                <span id="channel-count" class="muted"></span>
                <button id="restore-button" class="secondary-button" type="button">恢复默认</button>
                <button id="clear-button" class="danger-button" type="button">删除全部</button>
            </div>
        </div>
        <div id="channel-list" class="channel-list"></div>
    </section>

    <p id="toast" role="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
